name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    permissions:
      # tauri-action creates the GitHub Release and uploads the installers.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # minisign key that signs the updater manifest. This proves an update came
          # from this repository; it is NOT Authenticode and does not stop SmartScreen.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: SIO ${{ github.ref_name }}
          # NOT marked pre-release, despite this being early software. GitHub's
          # `/releases/latest` endpoint skips pre-releases entirely, so flagging it
          # makes the updater's own manifest URL 404 and silently disables in-app
          # updates. The maturity warning lives in the release body instead, where
          # people actually read it.
          prerelease: false
          releaseDraft: false
          releaseBody: |
            Windows installer below — `.exe` is the NSIS installer, `.msi` the MSI.

            ### Before you install

            **This has not been tested on real hardware end to end.** Every layer has
            automated tests, including against the real registry and the real elevated
            helper, but no package has actually been installed and no tweak actually
            applied through a live UAC prompt. **Try it on a throwaway VM first.**

            **Unsigned.** SmartScreen will warn on first run — SIO has no Authenticode
            certificate. That warning is accurate: it means nobody paid to vouch for
            this binary, not that the binary is known to be fine.

            In-app updates are a separate matter and *are* verified — each update is
            signed with the project's key and rejected if the signature does not match.

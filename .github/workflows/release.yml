name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    permissions:
      # tauri-action creates the GitHub Release and uploads the installers.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # minisign key that signs the updater manifest. This proves an update came
          # from this repository; it is NOT Authenticode and does not stop SmartScreen.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: SIO ${{ github.ref_name }}
          # Marked pre-release deliberately: the install and tweak paths have not yet
          # been exercised on real hardware end to end. Drop this once they have.
          prerelease: true
          releaseDraft: false
          releaseBody: |
            Windows installer below (`.exe` is the NSIS installer, `.msi` the MSI).

            **Unsigned.** SmartScreen will warn on first run — SIO has no Authenticode
            certificate. Choose *More info* → *Run anyway* if you trust this build.

            In-app updates are verified against the project's signing key.

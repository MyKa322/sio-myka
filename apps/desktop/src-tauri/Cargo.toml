[package]
name = "sio-desktop"
description = "SIO — Windows post-reinstall setup and tuning tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "sio-desktop"

# The library holds the app wiring so it can be exercised without launching a window;
# `main.rs` is only a thin entry point.
[lib]
name = "sio_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sio-core.workspace = true
sio-winsys.workspace = true
sio-packages.workspace = true
sio-tweaks.workspace = true
windows.workspace = true

tauri = { version = "2", features = [] }
# default-features = false swaps rustls for schannel. rustls pulls in `ring`, which
# compiles C — and on a machine with several Visual Studio installs cc-rs can pick one
# whose Windows SDK is not registered and fail with a missing `stddef.h`. schannel is
# pure Rust bindings to the TLS stack Windows already ships, and it uses the OS
# certificate store, which is the right behaviour for a Windows-only app anyway.
tauri-plugin-updater = { version = "2", default-features = false, features = [
    "native-tls",
    "zip",
] }
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Enabled by `tauri build --debug` and by the CLI's dev mode.
custom-protocol = ["tauri/custom-protocol"]
